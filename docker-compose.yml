services:
  mysql:
    image: mysql:8.4
    container_name: carnalitos-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carnalitos
      MYSQL_USER: carnalitos
      MYSQL_PASSWORD: carnalitos
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - carnalitos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucarnalitos", "-pcarnalitos"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  carnalitos_mysql_data:
